name: Sync provider catalogs
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-provider-catalogs
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch published release and export public content
        run: node scripts/sync-providers.mjs
      - name: Test distribution handling and build site
        working-directory: site
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
      - name: Open or update reviewed catalog PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/provider-catalogs
          delete-branch: true
          add-paths: site/tools
          commit-message: 'docs: sync provider catalogs'
          title: 'docs: sync provider catalogs'
          body: |
            Generated by the registered providers. Each provider owns release discovery,
            documentation selection, installation actions and its public-content policy.
            The consumer transports and validates bundles without product-specific rules.

            Review the version, installation command, docs and any screenshots.
            Merging this PR publishes the update through the existing Pages workflow.
